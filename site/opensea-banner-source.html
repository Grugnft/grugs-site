<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSea banner source</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#000; }
  body { font-family:'Press Start 2P', monospace; color:#F4E4C8; }

  /* OpenSea banner: 1400x400 (3.5:1). OpenSea crops top/bottom on mobile
     views, so keep primary content in the middle vertical band. */
  .banner {
    width: 1400px; height: 400px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 40% 70% at 50% 50%, rgba(232,161,71,0.10) 0%, rgba(0,0,0,0) 75%),
      linear-gradient(180deg, #241A12 0%, #1A140F 50%, #100a04 100%);
    box-sizing: border-box;
    color: #F4E4C8;
  }
  .speckle {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 5% 20%,  rgba(58,42,30,0.35) 1px, transparent 2px),
      radial-gradient(circle at 15% 70%, rgba(58,42,30,0.25) 1px, transparent 2px),
      radial-gradient(circle at 25% 30%, rgba(58,42,30,0.30) 1px, transparent 2px),
      radial-gradient(circle at 40% 80%, rgba(58,42,30,0.20) 1px, transparent 2px),
      radial-gradient(circle at 55% 15%, rgba(58,42,30,0.30) 1px, transparent 2px),
      radial-gradient(circle at 70% 55%, rgba(58,42,30,0.25) 1px, transparent 2px),
      radial-gradient(circle at 85% 25%, rgba(58,42,30,0.30) 1px, transparent 2px),
      radial-gradient(circle at 95% 75%, rgba(58,42,30,0.20) 1px, transparent 2px);
    background-size: 220px 220px;
    opacity: 0.55; pointer-events: none;
  }
  .wordmark {
    position: absolute;
    top: 42%; left: 50%; transform: translate(-50%, -50%);
    font-family:'Press Start 2P', monospace;
    font-size: 92px; letter-spacing: 10px;
    color: #F4E4C8;
    text-shadow:
      4px 4px 0 #1A140F,
      8px 8px 0 rgba(209,75,47,0.55),
      0 0 60px rgba(232,161,71,0.25);
    white-space: nowrap;
  }
  .underline {
    position: absolute;
    top: 62%; left: 50%; transform: translate(-50%, 0);
    width: 260px; height: 5px;
    background: linear-gradient(90deg, transparent, #E8A147, transparent);
  }
  .sublabel {
    position: absolute;
    top: 68%; left: 50%; transform: translate(-50%, 0);
    font-family: 'VT323', monospace;
    font-size: 26px; color: #E8A147;
    letter-spacing: 5px;
    text-shadow: 2px 2px 0 #1A140F;
    white-space: nowrap;
  }
  .grug-left, .grug-right {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.55));
  }
  .grug-left  { left:  70px; }
  .grug-right { right: 70px; }
  .grug-left  .g, .grug-right .g { height: 290px; width: 218px; display:flex; align-items:flex-end; }
  .grug-left  .g svg, .grug-right .g svg { height: 290px; width: 218px; display:block; image-rendering: pixelated; }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 100% 80% at 50% 50%, transparent 45%, #100a04 100%);
    pointer-events: none;
  }
  .chain {
    position: absolute; right: 32px; top: 22px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px; color: #8a6a4a;
    letter-spacing: 3px;
    z-index: 5;
  }
  .chain::before {
    content:""; display: inline-block;
    width: 9px; height: 9px; background: #5F8C4B;
    box-shadow: 0 0 8px #5F8C4B; margin-right: 8px;
    vertical-align: 1px;
  }
  .footer {
    position: absolute; bottom: 18px; right: 32px;
    font-family: 'VT323', monospace;
    font-size: 22px; color: #8a6a4a;
    letter-spacing: 2px;
    z-index: 5;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="speckle"></div>
  <div class="chain">ROBINHOOD CHAIN</div>
  <div class="grug-left"  id="grug-left"></div>
  <div class="grug-right" id="grug-right"></div>
  <div class="wordmark">GRUGS</div>
  <div class="underline"></div>
  <div class="sublabel">10,000 · ON CHAIN</div>
  <div class="vignette"></div>
  <div class="footer">grugnft.xyz</div>
</div>
<script>
const LEFT_IDS  = ['0512'];
const RIGHT_IDS = ['7712'];
async function loadSide(ids, targetId) {
  const holder = document.getElementById(targetId);
  const svgs = await Promise.all(ids.map(x => fetch('out/svg/' + x + '.svg').then(r => r.text())));
  holder.innerHTML = svgs.map(s => '<div class="g">' + s + '</div>').join('');
}
Promise.all([loadSide(LEFT_IDS,'grug-left'), loadSide(RIGHT_IDS,'grug-right')])
  .then(() => document.fonts ? document.fonts.ready : null)
  .then(() => document.body.setAttribute('data-ready', '1'))
  .catch(err => document.body.setAttribute('data-error', String(err)));
</script>
</body>
</html>
