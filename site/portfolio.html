<script type="module">
// Portfolio v2 — OpenSea-backed. One /api/portfolio call, one paint, done.
// No Blockscout, no vibe scoring, no lazy sidecar fetches. If the user
// wants the full rug audit for a specific collection, RR button opens the
// scanner in a new tab.

const state = {
  wallet: null,
  collections: [],        // straight from server
  floors: new Map(),      // slug -> { floorEth, currency } | 'loading' | null
  ethUsd: null,           // ETH/USD spot for cross-currency floor sort
  search: '',
  sort: 'owned-desc',
  loadAbort: null,
  floorAbort: null,
};

// Fire-and-forget: pull ETH/USD once per page load. Used by the floor
// sort so USDG-priced floors (~$1 each) sort correctly against ETH ones
// (~$2200 each) instead of drowning in raw-number ordering. Sort re-runs
// the moment the price lands.
(async () => {
  try {
    const r = await fetch('/api/eth-price').then(r => r.ok ? r.json() : null);
    if (r && typeof r.usd === 'number') { state.ethUsd = r.usd; renderAll(); }
  } catch {}
})();

const $ = id => document.getElementById(id);
const escapeHtml = s => (s ?? '').toString().replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortAddr = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '—';

function setStatus(text, isError) {
  const s = $('status');
  s.textContent = text;
  s.className = 'status-note' + (isError ? ' error' : '');
  s.hidden = !text;
}

function floorFor(c) {
  const f = c.slug ? state.floors.get(c.slug) : null;
  return (f && typeof f === 'object') ? f : null;
}

function passesFilters(c) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  const hay = ((c.name || '') + ' ' + (c.slug || '') + ' ' + c.contract).toLowerCase();
  return hay.includes(q);
}

function sortCollections(arr) {
  const sorted = [...arr];
  const nameOf = c => (c.name || c.slug || c.contract).toLowerCase();
  // Cross-currency floor sort: convert everything to USD so 100 USDG
  // correctly outranks 0.001 ETH. USDG (and any other stable-labelled
  // currency) is treated as $1. ETH is priced via /api/eth-price which
  // is cached 30 min server-side. If the ETH price hasn't landed yet
  // we fall back to a conservative $2000 — sort ordering is stable
  // enough at that scale for the paint before the real price arrives.
  const ethUsd = state.ethUsd || 2000;
  const floorUsdOf = c => {
    const f = floorFor(c);
    if (!f || typeof f.floorEth !== 'number' || f.floorEth <= 0) return null;
    const cur = (f.currency || 'ETH').toUpperCase();
    if (cur === 'ETH' || cur === 'WETH') return f.floorEth * ethUsd;
    if (cur === 'USDG' || cur === 'USDC' || cur === 'USDT' || cur === 'DAI') return f.floorEth;
    // Unknown currency — sink so an unpriceable row can't outrank real
    // priced ones. Currency labels in the UI stay accurate either way.
    return null;
  };
  switch (state.sort) {
    case 'owned-asc':  sorted.sort((a, b) => a.ownedCount - b.ownedCount); break;
    case 'az':         sorted.sort((a, b) => nameOf(a).localeCompare(nameOf(b))); break;
    case 'za':         sorted.sort((a, b) => nameOf(b).localeCompare(nameOf(a))); break;
    case 'floor-desc':
    case 'floor-asc': {
      // Rows without a known floor sink to the bottom so the top of the list
      // is always something the user can act on. Within known floors, sort
      // by USD-normalized value; within unknown, keep owned-count desc as a
      // fallback.
      const dir = state.sort === 'floor-desc' ? -1 : 1;
      sorted.sort((a, b) => {
        const fa = floorUsdOf(a), fb = floorUsdOf(b);
        if (fa == null && fb == null) return b.ownedCount - a.ownedCount;
        if (fa == null) return 1;
        if (fb == null) return -1;
        return (fa - fb) * dir;
      });
      break;
    }
    case 'owned-desc':
    default:           sorted.sort((a, b) => b.ownedCount - a.ownedCount); break;
  }
  return sorted;
}

function floorCellHtml(c) {
  const status = c.slug ? state.floors.get(c.slug) : null;
  if (status === 'loading' || status === undefined) return `<b><span class="spinner"></span></b>floor`;
  if (status && typeof status === 'object' && typeof status.floorEth === 'number' && status.floorEth > 0) {
    return `<b>${status.floorEth.toFixed(4)}</b>${escapeHtml(status.currency || 'ETH')} floor`;
  }
  return `<b>—</b>floor`;
}

function renderRow(c) {
  const visibleTokens = c.tokens;
  const iconUrl = c.iconUrl || visibleTokens[0]?.imageUrl || '';

  const thumb = iconUrl
    ? `<img class="thumb" src="${escapeHtml(iconUrl)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb thumb-fallback',textContent:'?'}))">`
    : `<div class="thumb thumb-fallback">?</div>`;

  const osBtn = c.openseaCollectionUrl
    ? `<button data-action="opensea" data-url="${escapeHtml(c.openseaCollectionUrl)}">OS</button>`
    : '';

  return `
    <div class="collection-row" data-addr="${escapeHtml(c.contract)}">
      <div class="row-head">
        ${thumb}
        <div class="name-wrap">
          <div class="name">${escapeHtml(c.name || shortAddr(c.contract))}${c.slug ? `<span class="slug">${escapeHtml(c.slug)}</span>` : ''}</div>
        </div>
        <div class="metric"><b>${c.ownedCount}</b>owned</div>
        <div class="metric floor">${floorCellHtml(c)}</div>
        <div class="row-actions">
          <button data-action="scanner" data-addr="${escapeHtml(c.contract)}">RR</button>
          ${osBtn}
          <button data-action="toggle" data-addr="${escapeHtml(c.contract)}">▾</button>
        </div>
      </div>
      <div class="tokens-drawer" hidden>
        ${visibleTokens.length
          ? visibleTokens.map(t => `
              <a class="token-card" href="${escapeHtml(t.openseaUrl || '#')}" target="_blank" rel="noopener" title="${escapeHtml(t.name || ('#' + t.id))}">
                ${t.imageUrl ? `<img src="${escapeHtml(t.imageUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div class="thumb-fallback" style="width:84px;height:84px;">?</div>`}
                <span class="tid">#${escapeHtml(t.id)}</span>
              </a>`).join('')
          : `<div style="color:var(--ash); font-size:14px; padding:12px;">no visible tokens (nsfw hidden)</div>`
        }
      </div>
    </div>`;
}

let renderPending = false;
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  setTimeout(() => { renderPending = false; renderAll(); }, 0);
}

function renderAll() {
  const filtered = sortCollections(state.collections.filter(passesFilters));
  $('collections').innerHTML = filtered.map(renderRow).join('');
  $('stat-tokens').textContent = state.collections.reduce((n, c) => n + c.ownedCount, 0);
  $('stat-collections').textContent = state.collections.length;
  const hidden = state.collections.length - filtered.length;
  if (hidden > 0) {
    $('stat-hidden-count').hidden = false;
    $('stat-hidden-num').textContent = hidden;
  } else {
    $('stat-hidden-count').hidden = true;
  }
}

// Lazy-fetch OpenSea floor for every collection with a slug. Concurrency 4
// keeps us polite; every request hits our OWN /api/floor endpoint (server
// caches 15 min per slug), so refreshing a wallet twice in a row is a
// no-op after the first pass. Aborts cleanly when the user reloads a
// different wallet.
async function loadAllFloors(signal) {
  const CONCURRENCY = 4;
  const queue = state.collections
    .filter(c => c.slug && !state.floors.has(c.slug))
    .map(c => c.slug);
  for (const s of queue) state.floors.set(s, 'loading');
  scheduleRender();
  const workers = Array.from({ length: Math.min(CONCURRENCY, queue.length) }, async () => {
    while (queue.length) {
      if (signal.aborted) return;
      const slug = queue.shift();
      try {
        const r = await fetch('/api/floor?slug=' + encodeURIComponent(slug), { signal }).then(r => r.ok ? r.json() : null);
        state.floors.set(slug, r || null);
      } catch (e) {
        if (e.name === 'AbortError') return;
        state.floors.set(slug, null);
      }
      scheduleRender();
    }
  });
  await Promise.all(workers);
}

document.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.action;
  const addr = btn.dataset.addr;
  if (act === 'toggle') {
    const row = btn.closest('.collection-row');
    const drawer = row.querySelector('.tokens-drawer');
    drawer.hidden = !drawer.hidden;
    btn.textContent = drawer.hidden ? '▾' : '▴';
  } else if (act === 'scanner') {
    window.open('/scanner.html?addr=' + addr, '_blank', 'noopener');
  } else if (act === 'opensea') {
    window.open(btn.dataset.url, '_blank', 'noopener');
  }
});

async function loadPortfolio(wallet) {
  if (state.loadAbort) state.loadAbort.abort();
  if (state.floorAbort) state.floorAbort.abort();
  state.loadAbort = new AbortController();
  state.floorAbort = new AbortController();
  const signal = state.loadAbort.signal;

  state.wallet = wallet;
  state.collections = [];
  state.floors = new Map();
  $('collections').innerHTML = '';
  $('stats-bar').hidden = false;
  $('filter-bar').hidden = false;
  $('stat-tokens').textContent = '0';
  $('stat-collections').textContent = '0';
  setStatus(`grug asking opensea for every nft in ${shortAddr(wallet)}…`);

  try {
    const r = await fetch('/api/portfolio?wallet=' + wallet, { signal });
    if (signal.aborted) return;
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      if (body?.error === 'not_configured') {
        setStatus('opensea api key not configured on the server. tell grug in the discord.', true);
      } else if (r.status === 429) {
        setStatus('opensea is rate-limiting grug right now. wait ~30 seconds and try again.', true);
      } else {
        setStatus(`grug could not reach opensea (status ${r.status}). try again in a moment.`, true);
      }
      return;
    }
    const data = await r.json();
    if (signal.aborted) return;
    state.collections = Array.isArray(data.collections) ? data.collections : [];
    if (state.collections.length === 0) {
      setStatus('this wallet holds no NFTs on RHC yet (or opensea hasn’t indexed them).');
    } else if (data.truncated) {
      setStatus(`grug loaded ${data.ownedTokens} tokens across ${data.collectionCount} collections (capped — very large wallets get truncated)${data.cached ? ' · cached' : ''}`);
    } else {
      setStatus(data.cached ? `${data.collectionCount} collections · cached from earlier scan` : '');
    }
    renderAll();
    // Kick lazy floor loading in the background — rows re-render as prices
    // trickle in. Don't block the initial paint on this.
    loadAllFloors(state.floorAbort.signal);
  } catch (e) {
    if (e.name === 'AbortError') return;
    setStatus('grug had a network hiccup. try again in a moment.', true);
  }
}

async function connectWallet() {
  if (typeof window === 'undefined' || !window.ethereum) {
    setStatus('no wallet detected. install MetaMask, Rainbow, or Coinbase Wallet.', true);
    return;
  }
  try {
    const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const addr = (accs && accs[0]) || null;
    if (!addr) { setStatus('no account approved.', true); return; }
    $('wallet-input').value = addr;
    loadPortfolio(addr.toLowerCase());
  } catch (e) {
    setStatus('wallet connect refused.', true);
  }
}

$('load-btn').addEventListener('click', () => {
  const v = $('wallet-input').value.trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(v)) {
    setStatus('please paste a valid 0x… wallet address (40 hex chars after 0x).', true);
    return;
  }
  loadPortfolio(v.toLowerCase());
});
$('connect-btn').addEventListener('click', connectWallet);
$('wallet-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('load-btn').click();
});
$('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  renderAll();
});
$('sort-select').addEventListener('change', e => {
  state.sort = e.target.value;
  renderAll();
});
// Deep-link: ?wallet=0x…
const url = new URL(location.href);
const preload = url.searchParams.get('wallet');
if (preload && /^0x[0-9a-fA-F]{40}$/.test(preload)) {
  $('wallet-input').value = preload;
  loadPortfolio(preload.toLowerCase());
}
</script>
