<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your testnet tribe</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#1A140F; color:#F4E4C8; font-family: 'VT323', monospace; }
  .header { padding: 24px 32px; border-bottom: 2px solid #3A2A1E; }
  .header h1 { margin:0 0 4px 0; font-family: 'Press Start 2P', monospace; font-size: 20px; color: #E8A147; letter-spacing: 2px; }
  .header p { margin: 0; color: #8a6a4a; font-size: 20px; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; padding: 32px; max-width: 1400px; margin: 0 auto; }
  .card { background: #241A12; border: 2px solid #3A2A1E; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.5); }
  .card-img { aspect-ratio: 3/4; background: #100a04; }
  .card-img svg { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  .card-body { padding: 16px 18px; }
  .card-id { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #8a6a4a; letter-spacing: 1px; margin-bottom: 4px; }
  .card-name { font-family: 'Press Start 2P', monospace; font-size: 14px; color: #F4E4C8; letter-spacing: 1px; margin-bottom: 8px; }
  .card-desc { font-size: 18px; color: #b09070; margin: 0; line-height: 1.3; }
  #loading { padding: 40px; text-align: center; color: #8a6a4a; font-size: 20px; }
</style>
</head>
<body>
<div class="header">
  <h1>YOUR TESTNET TRIBE</h1>
  <p>5 grug live in your wallet on Robinhood Chain testnet</p>
</div>
<div class="grid" id="grid"><div id="loading">loading from IPFS…</div></div>
<script>
const META = 'bafybeib6ppcv4enyebretllhgvh32bc52osjtzr7lbgogzr2ocglmovili';
const IDS = [1, 2, 3, 4, 5];
const grid = document.getElementById('grid');
(async () => {
  const cards = await Promise.all(IDS.map(async (id) => {
    const meta = await fetch(`https://gateway.pinata.cloud/ipfs/${META}/${id}.json`).then(r => r.json());
    const imgUrl = meta.image.replace('ipfs://', 'https://gateway.pinata.cloud/ipfs/');
    const svg = await fetch(imgUrl).then(r => r.text());
    return { id, meta, svg };
  }));
  grid.innerHTML = cards.map(c => `
    <div class="card">
      <div class="card-img">${c.svg}</div>
      <div class="card-body">
        <div class="card-id">GRUG #${String(c.id).padStart(4,'0')}</div>
        <div class="card-name">${c.meta.attributes.find(a => a.trait_type==='Name')?.value || ''}</div>
        <p class="card-desc">${c.meta.description}</p>
      </div>
    </div>
  `).join('');
  document.body.setAttribute('data-ready', '1');
})();
</script>
</body>
</html>
